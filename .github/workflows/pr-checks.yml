name: PR Checks
on:
  push:
  
    branches: [ main, release/* ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret Scan
        uses: trufflesecurity/trufflehog@v3.88.0      with: { path: ., fail: true }
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3.2.0
        with: { file_or_dir: k8s/ }
      - name: Dockerfile Lint
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: docker/ }
