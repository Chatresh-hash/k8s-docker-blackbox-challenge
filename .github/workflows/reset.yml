name: Reset Repo Setup

on:
  workflow_dispatch:   # Trigger manually from GitHub Actions UI

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Remove Git pre-push hook
        run: |
          if [ -f .git/hooks/pre-push ]; then
            echo "🔧 Removing Git pre-push hook..."
            rm .git/hooks/pre-push
          else
            echo "ℹ️ No pre-push hook found."
          fi

      - name: Delete sample release tag
        run: |
          if git rev-parse v0.1.0 >/dev/null 2>&1; then
            echo "🏷️ Deleting sample tag v0.1.0..."
            git tag -d v0.1.0
            git push origin :refs/tags/v0.1.0
          else
            echo "ℹ️ No sample tag v0.1.0 found."
          fi

      - name: Reset secrets placeholders
        run: |
          if [ -f .github/secrets.env ]; then
            echo "🔑 Resetting secrets placeholders..."
            rm .github/secrets.env
          else
            echo "ℹ️ No secrets.env file found."
          fi

      - name: Commit cleanup (optional)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: reset repo setup"
          git push
